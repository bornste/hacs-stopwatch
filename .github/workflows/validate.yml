name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Run HACS validation
        uses: hacs/action@main
        with:
          category: integration

  version:
    name: Version and changelog
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
      - name: Check that the manifest version has a changelog entry
        run: |
          version=$(python3 -c "import json; print(json.load(open('custom_components/stopwatch_plus/manifest.json'))['version'])")
          case "$version" in
            *.dev*)
              # Development version between releases: changes go under [Unreleased]
              heading="## [Unreleased]"
              ;;
            *)
              heading="## [$version]"
              ;;
          esac
          if ! grep -qF "$heading" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::CHANGELOG.md has no section '$heading' for version $version in manifest.json"
            exit 1
          fi
          echo "CHANGELOG.md has the section '$heading' for version $version"
